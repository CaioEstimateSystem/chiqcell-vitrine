<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chiq Cell Estoque</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chiq Cell">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Chiq Cell">
<meta name="theme-color" content="#243fcc">
<style>
/* Direção visual (08/10/2026): referência Apple como na Chiq — superfícies planas, tipografia nativa, números grandes, ação em cobalto.
   Só aparência: nenhuma classe, id ou função foi alterada. Azul da loja (#1428cc) aparece em ação, marca e um único destaque por tela. */
:root{
  --brand:#243fcc; --brand-ink:#ffffff; --brand-soft:#eaecfb; --brand-strong:#1a2fa3;
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f5f5f7; --line:#e5e5ea;
  --fg:#1d1d1f; --muted:#5f6368; --faint:#6e6e73; --field:#8a8a8f; --link:var(--brand); --c-in:#8e8e93; --c-rep:#c7c7cc;
  --ok:#0b6e4a; --ok-soft:#e5f5ed; --warn:#9a5b00; --warn-soft:#fdf1dc; --bad:#c0362c; --bad-soft:#fde9e7;
  --shadow:0 12px 40px rgba(0,0,0,.12);
  --glass:rgba(255,255,255,.78);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r:12px; --r-sm:8px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --brand:#4a5fe8; --brand-ink:#ffffff; --brand-soft:#1b2260; --brand-strong:#a5b2ff;
  --bg:#000000; --surface:#1c1c1e; --surface-2:#141416; --line:#2c2c2e;
  --fg:#f5f5f7; --muted:#a1a1a6; --faint:#8d8d93; --field:#8e8e93; --link:#7d8fff; --c-in:#8e8e93; --c-rep:#48484a;
  --ok:#3ccf91; --ok-soft:#0f2e20; --warn:#f0b04a; --warn-soft:#33260c; --bad:#ff7a6e; --bad-soft:#3a1714;
  --shadow:0 12px 40px rgba(0,0,0,.6); --glass:rgba(28,28,30,.78); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.022em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.82em}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* marca */
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--fg)}
.logo .mark{width:34px;height:34px;border-radius:10px 10px 10px 18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:19px;flex:none}
.logo img{height:36px;max-width:150px;object-fit:contain}
.logo-tile{display:inline-flex;align-items:center;justify-content:center;background:#243fcc;border-radius:14px;padding:6px 12px;line-height:0}
.logo-tile img{height:34px;width:auto;max-width:none;object-fit:contain}
.side .logo-tile{width:100%;padding:10px 14px;border-radius:14px}.side .logo-tile img{height:64px;width:auto;object-fit:contain}
.topbar .logo-tile{padding:3px 10px;border-radius:12px}.topbar .logo-tile img{height:42px;width:auto;object-fit:contain}
.login-art .brandlogo{width:min(300px,70%);height:auto;object-fit:contain;display:block}
.logo b{color:var(--brand)}

/* login: a parede curva azul da loja */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--brand);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;border-radius:0 72px 72px 0}
.login-art::after{content:"";position:absolute;right:-30%;bottom:-40%;width:90%;aspect-ratio:1;border-radius:50%;border:56px solid rgba(255,255,255,.07)}
.login-art h1{font-size:clamp(36px,4.6vw,60px);line-height:1.02;font-weight:700;max-width:12ch;letter-spacing:-.035em}
.login-art p{opacity:1;max-width:38ch;font-size:17px}
.login-art .logo{color:#fff}.login-art .logo .mark{background:#fff;color:var(--brand)}.login-art .logo b{color:#fff;opacity:.75}
.login-form{display:grid;place-items:center;padding:32px 20px}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.login-card h2{font-size:32px;font-weight:700}
.demo-box{border:1px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.demo-box small{color:var(--muted);font-weight:600;font-size:12px}
.demo-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.demo-row span{color:var(--muted);font-size:14px}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-art{padding:32px 20px 40px;min-height:auto;gap:32px;border-radius:0 0 40px 40px}.login-art h1{font-size:36px}}

/* estrutura */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease)}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--brand-soft);color:var(--brand-strong)}
.nav svg{width:20px;height:20px;flex:none}
.nav .count{margin-left:auto;background:#c0362c;color:#fff;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:700}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.me-row{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-weight:700;flex:none}
.me-name{font-weight:700;line-height:1.2}
.main{min-width:0;padding:36px clamp(16px,3.4vw,48px) 56px;display:flex;flex-direction:column;gap:28px;max-width:1280px}
.topbar{display:none}
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .main{padding:20px 16px 104px;gap:22px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:600;padding:4px 6px;min-height:48px;border-radius:10px;cursor:pointer;min-width:0;flex:1}
  .tabbar a.on{color:var(--link)}
  .tabbar svg{width:24px;height:24px}
}

/* cabeçalho de página */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:clamp(28px,3vw,36px);font-weight:700;letter-spacing:-.034em;line-height:1.05}
.head p{margin:6px 0 0;color:var(--muted);font-size:17px}
.head .actions{display:flex;gap:10px;flex-wrap:wrap}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 18px;min-height:44px;border-radius:99px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.btn.icon{padding:0;width:44px;height:44px}
.btn.sm.icon{width:36px;height:36px}
.btn svg{width:18px;height:18px}
.btn.block{width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
.in{width:100%;min-height:46px;border:1px solid var(--field);background:var(--surface);border-radius:var(--r-sm);padding:11px 14px;font-size:16px;color:var(--fg);transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:18px}

/* superfícies e números */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.card h2{font-size:20px;font-weight:700}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h a{color:var(--link);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0;container-type:inline-size}
.kpi .l{font-size:14px;color:var(--muted);font-weight:600}
.kpi .v{white-space:nowrap;font-family:var(--f-display);font-size:clamp(28px,13cqw,40px);overflow:hidden;font-weight:700;letter-spacing:-.034em;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .s{font-size:14px;color:var(--muted)}
.kpi.click{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,transform .2s var(--ease)}
.kpi.click:hover{border-color:var(--bad);transform:translateY(-2px)}
.kpi .go{font-size:14px;font-weight:700;color:var(--bad);margin-top:2px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}

/* estados */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand-strong)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}

/* filtros e tabela */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 260px;position:relative}
.toolbar .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.toolbar .search .in{padding-left:42px;border-radius:99px}
.toolbar select.in{width:auto;flex:0 1 auto;border-radius:99px;padding-left:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pname{font-weight:600}
.psub{color:var(--muted);font-size:14px}
.qty{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;width:70px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}
@media (max-width:700px){.hide-sm{display:none}td,th{padding:12px 10px}td:first-child,th:first-child{padding-left:16px}.rowact .btn.icon{width:40px;height:40px}.rowact{gap:2px}.kpi{padding:16px}.card{padding:18px}}
.foot{color:var(--muted);font-size:14px}

/* lista simples */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
#al .t{white-space:normal}
@media (max-width:560px){#al .pill,#opl .pill{display:none}#opl .t{white-space:normal}}
.li .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.li .ic svg{width:18px;height:18px}
.li .ic.in-{background:var(--ok-soft);color:var(--ok)}
.li .ic.out{background:var(--brand-soft);color:var(--brand-strong)}
.li .ic.rep{background:var(--warn-soft);color:var(--warn)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:14px;color:var(--muted)}

/* gráfico */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* ordens de serviço */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lane h4{margin:0;font-size:14px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.os{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,transform .2s var(--ease)}
.os:hover{border-color:var(--brand);transform:translateY(-1px)}
.os .n{font-family:var(--f-mono);font-size:13px;color:var(--faint)}
.os .c{font-weight:700}
.os .a{font-size:14px;color:var(--muted)}
.os .pc{font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center}
.os .pc svg{width:14px;height:14px;flex:none}
.sec{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.sec h4{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.addp{display:grid;grid-template-columns:1fr 72px auto;gap:8px;align-items:center}
@media (max-width:900px){.kanban{grid-template-columns:1fr;overflow:visible}}
.steps{display:flex;align-items:flex-start;gap:0}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--faint);text-align:center;position:relative;min-width:0}
.step::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--ok)}
.step i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-style:normal;position:relative;z-index:1;color:var(--faint)}
.step i svg{width:15px;height:15px}
.step.done{color:var(--ok)}.step.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur{color:var(--brand-strong)}.step.cur i{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong)}
.step.wait{color:var(--warn)}.step.wait i{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.mini{display:flex;gap:3px}.mini b{flex:1;height:4px;border-radius:99px;background:var(--line)}.mini b.on{background:var(--ok)}.mini b.cur{background:var(--brand)}.mini b.wait{background:var(--warn)}
.nextbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px;border-radius:12px;background:var(--brand-soft)}
.nextbar .lbl{flex:1 1 180px;font-size:14px;color:var(--brand-strong);font-weight:600}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist div{display:flex;gap:8px;align-items:baseline}.hist b{min-width:0}.hist span{color:var(--muted)}
.os .okb{margin-top:4px;justify-content:center}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--ok)}100%{box-shadow:0 0 0 0 transparent}}
.queue{display:flex;flex-direction:column;gap:12px}
button.os{font:inherit;color:inherit;text-align:left;width:100%}
.sech{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center}.sech .num{color:var(--muted);font-weight:600}
.orow .nx{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}.orow .nx b{color:var(--brand-strong)}
.oshead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.oshead .c{font-weight:700;font-size:18px}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface-2)}
.ptxt{margin:0;color:var(--fg)}
.flab{font-size:14px;font-weight:600;color:var(--muted)}
.addbox summary,.more summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--brand-strong);display:flex;gap:6px;align-items:center;list-style:none;min-height:44px}
.more summary{color:var(--muted)}
.addbox summary::-webkit-details-marker,.more summary::-webkit-details-marker{display:none}
.confirm{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--brand);background:var(--brand-soft)}
.orow{gap:12px;padding:16px 18px}
.orow-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.orow .c{font-weight:700;font-size:17px}
.os.flash{animation:flash 1.6s ease-out}
@media (max-width:560px){.addp{grid-template-columns:1fr 72px}.addp .btn{grid-column:1/-1}}

/* janelas e avisos */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .18s}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:580px;max-height:min(92vh,840px);max-height:min(92dvh,840px);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:rise .24s var(--ease)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 6px}
.modal-h h2{font-size:24px;font-weight:700}

function seed(){
  const r = rng(1672);
  const pick = a => a[Math.floor(r()*a.length)];
  const ri = (a,b) => a + Math.floor(r()*(b-a+1));
  const users = [
    {id:'u1',nome:'Dono Chiq Cell',usuario:'dono',senha:'chiq2026',papel:'dono',ativo:true},
    {id:'u2',nome:'Juliana Prado',usuario:'juliana',senha:'loja2026',papel:'funcionario',ativo:true},
    {id:'u3',nome:'Bruno Lima',usuario:'bruno',senha:'loja2026',papel:'funcionario',ativo:true},
    {id:'u4',nome:'Paula Souza',usuario:'paula',senha:'loja2026',papel:'dono',ativo:true},
    {id:'u5',nome:'Lucas Teixeira',usuario:'lucas',senha:'loja2026',papel:'funcionario',ativo:true},
  ];
  const produtos = [];
  let sku = 1000;
  for(const [nome,base,caps,cores,linha] of MODELOS){
    const conds = NOVOS.includes(linha) ? ['Novo','Seminovo'] : ['Seminovo'];
    if(linha==='18') conds.length = 1;
    caps.forEach((cap,ci)=>{
      cores.forEach(cor=>{
        conds.forEach(cond=>{
          if(r()<.25 && produtos.length>4) return;
          const capF = 1 + ci*.16;
          const preco = Math.round((cond==='Novo'? base : base*.72)*capF/10)*10 - 1;
          const custo = Math.round(preco*(cond==='Novo'? .82 : .66)/10)*10;
          const min = cond==='Novo' ? 2 : 1;
          let qtd = ri(2,9); if(r()<.05) qtd = 0; else if(r()<.08) qtd = 1;
          produtos.push({id:uid(),cat:'aparelho',nome,linha,variante:`${cap>=1024?'1 TB':cap+' GB'} · ${cor}`,condicao:cond,sku:'AP-'+(sku++),qtd,min,custo,preco,local:'Vitrine '+pick(['A','B','C']),fornecedor:cond==='Novo'?'Distribuidora Apple BR':'Trade-in / compra direta'});
        });
      });
    });
  }
  sku = 2000;
  for(const [nome,,,,linha] of MODELOS){
    if(['18'].includes(linha) || nome==='iPhone Duo' || nome==='iPhone Air') continue;
    for(const [tipo,fator,min,principal] of PECA_TIPOS){
      const quals = tipo==='Tela' ? PECA_QUAL : principal ? [PECA_QUAL[0],PECA_QUAL[1]] : [r()<.5?PECA_QUAL[0]:PECA_QUAL[1]];
      for(const [q,qf] of quals){
        if(r()<(principal?.35:tipo==='Placa lógica'?.85:.3)) continue;
        const custo = Math.round((TELA_CUSTO[linha]||400)*fator*qf*(nome.includes('Pro Max')?1.15:nome.includes('Pro')?1.08:1)/5)*5;
        const preco = Math.round(custo*2.1/10)*10 + 90;
        let qtd = ri(min,min+7); if(r()<.05) qtd = 0; else if(r()<.07) qtd = min;
        produtos.push({id:uid(),cat:'peca',nome:`${tipo} ${nome}`,tipo,modelo:nome,linha,variante:q,qualidade:q,sku:'PC-'+(sku++),qtd,min,custo,preco,local:'Gaveta '+pick(['A','B','C','D'])+ri(1,8),fornecedor:pick(['Mobile Parts SP','iParts Brasil','Fornecedor Rio Peças'])});
      }
    }
  }
  sku = 3000;
  for(const [nome,preco,custo] of ACESSORIOS){
    produtos.push({id:uid(),cat:'acessorio',nome,variante:'',sku:'AC-'+(sku++),qtd:ri(3,16),min:nome.includes('Cabo')||nome.includes('Película')||nome.includes('Capa')?6:2,custo,preco,local:'Balcão',fornecedor:'Distribuidora Apple BR'});
  }
  // movimentações dos últimos 14 dias
  const movs = [];
  const now = Date.now();
  for(let d=13; d>=0; d--){
    const n = ri(3,9);
    for(let k=0;k<n;k++){
      const p = pick(produtos);
      const t = r();
      const tipo = p.cat==='peca' ? (t<.55?'reparo':'entrada') : (t<.62?'venda':'entrada');
      movs.push({id:uid(),ts:now - d*DAY - ri(1,9)*3600e3 - ri(0,59)*60e3,prodId:p.id,tipo,qtd:tipo==='entrada'?ri(1,4):1,obs:tipo==='venda'?'Venda balcão':tipo==='reparo'?'Usada em reparo':'Reposição fornecedor',userId:pick(users).id});
    }
  }
  const vend = produtos.filter(p=>p.cat!=='peca' && p.qtd>2);
  [35,95,170].forEach(min=>{ const p = pick(vend); movs.push({id:uid(),ts:now-min*60e3,prodId:p.id,tipo:'venda',qtd:1,obs:'Venda balcão',userId:pick(users).id}); });
  movs.sort((a,b)=>b.ts-a.ts);
  const pecas = produtos.filter(p=>p.cat==='peca');
  const findPeca = (modelo,tipo) => pecas.find(p=>p.modelo===modelo && p.tipo===tipo) || pick(pecas);
  const TECS = ['u2','u3','u5'];
  // histórico: reparos entregues nos últimos ~75 dias (alimenta o desempenho por técnico)
  const DEFEITOS = [['Tela quebrada','Tela'],['Bateria viciada','Bateria'],['Não carrega','Conector de carga (flex)'],['Câmera não foca','Câmera traseira'],['Vidro traseiro trincado','Tampa traseira (vidro)'],['Som baixo nas ligações','Auricular'],['Face ID não funciona','Câmera frontal / Face ID'],['Botão power travado','Botão power (flex)'],['Não vibra','Motor de vibração (Taptic Engine)'],['Microfone falhando','Microfone']];
  const NOMES = ['Ana','Bruna','Caio','Daniel','Eduarda','Felipe','Gabriel','Helena','Igor','Jéssica','Kauã','Larissa','Mateus','Nathalia','Otávio','Pedro','Rafaela','Sabrina','Tiago','Vitória','Wesley','Yasmin'];
  const SOBR = ['Silva','Santos','Oliveira','Souza','Lima','Pereira','Costa','Ribeiro','Almeida','Carvalho','Gomes','Martins'];
  const MOD_REP = MODELOS.filter(m=>['11','12','13','14','15','16','17'].includes(m[4])).map(m=>m[0]);
  const hist_os = [];
  let hn = 880;
  for(let d=75; d>=2; d--){
    const n = r()<.25 ? 0 : r()<.6 ? 1 : 2;
    for(let k=0;k<n;k++){
      const aparelho = pick(MOD_REP); const [defeito,tipo] = pick(DEFEITOS);
      const pc = pecas.find(p=>p.modelo===aparelho && p.tipo===tipo);
      const tec = r()<.42 ? 'u2' : r()<.6 ? 'u3' : 'u5';
      const ts = now - d*DAY + ri(9,12)*3600e3;
      const mao = tipo==='Tela'?120: ri(6,12)*10;
      const valor = (pc? pc.preco : 180) + mao;
      const steps = OS_FLOW.map((st,j)=>({status:st, ts:ts + [0,1,3,26,30][j]*3600e3, userId: j===0 ? pick(users).id : tec}));
      hist_os.push({id:uid(),num:hn++,ts,cliente:`${pick(NOMES)} ${pick(SOBR)}`,telefone:`(21) 9${ri(7000,9999)}-${ri(1000,9999)}`,aparelho,defeito,status:'Entregue',
        diagnostico:`${tipo} com defeito. Troca realizada.`,tecnicoId:tec,hist:steps,pecas:pc?[{prodId:pc.id,qtd:1,ts:ts+2*3600e3,userId:tec}]:[],valor,userId:steps[0].userId});
    }
  }
  const os = [
    // cliente, tel, aparelho, defeito relatado, status, diagnóstico do técnico, peça usada (tipo) ou null
    ['Marcos Vinícius','(21) 98811-2040','iPhone 13','Tela trincada, touch falhando','Em reparo','Display danificado, touch sem resposta no canto superior.','Tela'],
    ['Aline Ferreira','(21) 97022-1188','iPhone 14 Pro','Bateria descarregando rápido','Pronto','Saúde da bateria em 74%. Troca indicada.','Bateria'],
    ['Diego Martins','(21) 99610-3321','iPhone 12','Não carrega','Recebido','',null],
    ['Carla Nunes','(21) 98450-7765','iPhone 15 Pro Max','Vidro traseiro quebrado','Aguardando peça','Tampa traseira precisa ser trocada. Peça sem estoque, pedido feito ao fornecedor.',null],
    ['Thiago Rocha','(21) 99123-0098','iPhone 11','Desligando sozinho','Entregue','Bateria inchada. Trocada.','Bateria'],
    ['Fernanda Lopes','(21) 97788-4512','iPhone 16','Está esquentando muito','Em diagnóstico','',null],
    ['Rodrigo Alves','(21) 98200-6631','iPhone 13 Pro','Câmera tremendo na foto','Recebido','',null],
  ].map(([cliente,tel,aparelho,defeito,status,diagnostico,tipo],i)=>{
    const pc = tipo ? findPeca(aparelho,tipo) : null;
    const ts = now-(7-i)*DAY*0.85;
    const path = status==='Aguardando peça' ? ['Recebido','Em diagnóstico','Aguardando peça'] : OS_FLOW.slice(0, OS_FLOW.indexOf(status)+1);
    const tec = pick(TECS);
    const hist = path.map((st,k)=>({status:st, ts:ts+k*5*3600e3, userId:k===0?pick(users).id:tec}));
    return {id:uid(),num:1040+i,ts,cliente,telefone:tel,aparelho,defeito,status,diagnostico,hist,tecnicoId:path.length>1?tec:null,
      pecas: pc ? [{prodId:pc.id,qtd:1,ts:ts+3*3600e3,userId:pick(users).id}] : [],
      valor: pc ? pc.preco + (tipo==='Tela'?80:40) : 0, userId:pick(users).id};
  });
  os.push(...hist_os.reverse());
  return {users,produtos,movs,os,cfg:{logo:null,loja:'Chiq Cell · Ponto Chic, Bangu'},osSeq:1046,ver:5};
}

let DB;
function rotularTabelas(){
  document.querySelectorAll('.tbl-wrap table:not(.est)').forEach(t=>{
    t.classList.add('cards');
    const ths = [...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{ [...tr.children].forEach((td,i)=>{ if(td.dataset.label===undefined) td.dataset.label = ths[i]||''; }); });
  });
}
new MutationObserver(() => { requestAnimationFrame(rotularTabelas); }).observe(document.getElementById('root'), {childList:true, subtree:true});
let SAVE_OK = true;
function banner(msg, cls){
  document.querySelectorAll('.banner').forEach(x=>x.remove());
  if(!msg) return;
  const b = document.createElement('div'); b.className = 'banner '+(cls||''); b.setAttribute('role','alert'); b.textContent = msg;
  if(cls==='info'){ b.textContent = msg+' (toque para fechar)'; b.onclick = () => b.remove(); }
  document.body.insertBefore(b, document.body.firstChild);
}
function load(){
  let aviso = '';
  try{
    const s = localStorage.getItem(KEY);
    if(s){
      let d = null;
      try{ d = JSON.parse(s); }catch(e){ try{ localStorage.setItem(KEY+'.corrompido', s); }catch(_){} aviso = 'Os dados deste aparelho estavam corrompidos. Uma cópia foi guardada e o app voltou ao exemplo. Avise o dono.'; }
      if(d && d.ver>=5){ DB = d; return; }
      if(d){ try{ localStorage.setItem(KEY+'.versao-antiga', s); }catch(_){} const logo = d.cfg?.logo; DB = seed(); DB.cfg.logo = logo; save(); return; }
    }
  }catch(e){}
  DB = seed(); save();
  if(aviso) banner(aviso,'info');
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); if(!SAVE_OK){ SAVE_OK = true; banner(''); } return true; }
  catch(e){ SAVE_OK = false; banner('Não foi possível salvar neste aparelho. Não feche o app e avise o dono da loja.'); return false; }
}
function exportBackup(){
  try{
    const blob = new Blob([JSON.stringify(DB)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'chiqcell-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    return true;
  }catch(e){ return false; }
}

function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
  const sp = document.createElement('span'); sp.textContent = msg + (SAVE_OK ? '' : ' — NÃO foi salvo'); t.appendChild(sp);
  if(undo){ const b = document.createElement('button'); b.type = 'button'; b.className = 'tb'; b.textContent = 'Desfazer'; b.onclick = () => { t.remove(); undo(); }; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(()=>t.remove(), undo ? 9000 : 2600);
}
const visivel = x => !x.disabled && x.getClientRects().length>0 && !x.closest('details:not([open])') && getComputedStyle(x).visibility!=='hidden';
function modal({title, body, foot, onMount}){
  const bg = document.createElement('div'); bg.className='modal-bg';
  const prev = document.activeElement; const tid = 'mt-'+uid();
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="${tid}" tabindex="-1"><div class="modal-h"><h2 id="${tid}">${esc(title)}</h2><button class="btn ghost icon" data-x aria-label="Fechar">${ICON.x}</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); if(prev && prev.focus && document.contains(prev)) prev.focus(); else { const v = document.getElementById('view'); if(v) v.focus({preventScroll:true}); } };
  const onKey = e => {
    if(e.key==='Escape'){ close(); return; }
    if(e.key!=='Tab') return;
    const fs = [...bg.querySelectorAll('button,[href],input,select,textarea,summary,[tabindex]:not([tabindex="-1"])')].filter(visivel);
    if(!fs.length) return;
    const a = fs[0], z = fs[fs.length-1];
    if(e.shiftKey && (document.activeElement===a || document.activeElement===bg.querySelector('.modal'))){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); }
  };
  document.addEventListener('keydown', onKey);
  let sujo = false; bg.addEventListener('input', () => { sujo = true; });
  bg.addEventListener('click', e => { if(e.target.closest('[data-x]') || (e.target===bg && !sujo)) close(); });
  document.body.appendChild(bg);
  const first = [...bg.querySelectorAll('input,select,textarea')].find(visivel);
  if(first && !matchMedia('(pointer:coarse)').matches) first.focus(); else bg.querySelector('.modal').focus();
  onMount && onMount(bg, close);
  return close;
}
function confirmBox(title, text, okLabel, onOk){
  modal({title, body:`<p style="margin:0;color:var(--muted)">${esc(text)}</p>`, foot:`<button class="btn" data-x>Cancelar</button><button class="btn pri" id="cf-ok">${esc(okLabel)}</button>`,
    onMount:(el,close)=>{ $('#cf-ok',el).onclick=()=>{ close(); onOk(); }; }});
}

function alertList(){

function drawChart14(el){
  const days = []; const base = new Date(); base.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){ const s = base.getTime()-i*DAY; days.push({s, e:s+DAY, entrada:0, venda:0, reparo:0}); }
  DB.movs.forEach(m=>{ const d = days.find(d=>m.ts>=d.s&&m.ts<d.e); if(d && d[m.tipo]!==undefined) d[m.tipo]+=m.qtd; });
  const W = Math.max(300, Math.round(el.clientWidth||640)), H = W<480 ? 190 : 220, pl = 30, pb = 26, pt = 10; const iw = W-pl-8, ih = H-pb-pt;
  const max = Math.max(4,...days.map(d=>d.entrada+d.venda+d.reparo)); const top = Math.ceil(max/4)*4;
  const bw = iw/days.length; const y = v => pt+ih - v/top*ih; const step = W<480 ? 3 : 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Movimentações por dia, últimos 14 dias">`;
  for(let g=0; g<=4; g++){ const val = top*g/4; s += `<line x1="${pl}" x2="${W-8}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(val)+4}" text-anchor="end">${val}</text>`; }
  days.forEach((d,i)=>{
    const x = pl + i*bw + bw*.18, w = bw*.64; let acc = 0;
    [['venda','var(--brand)'],['entrada','var(--c-in)'],['reparo','var(--c-rep)']].forEach(([k,c])=>{ if(!d[k]) return; const y0=y(acc), y1=y(acc+d[k]); s+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1-1)}" rx="2" fill="${c}"><title>${fmtDate(d.s)} · ${k}: ${d[k]}</title></rect>`; acc+=d[k]; });
    if((13-i)%step===0) s += `<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${i===13?'hoje':fmtDate(d.s)}</text>`;
  });
  el.innerHTML = s + '</svg>';
  const sm = document.getElementById('chsum'); const h = days[13];
  el.insertAdjacentHTML('beforeend', `<table class="sr-tab"><caption>Movimentações por dia</caption><thead><tr><th>Dia</th><th>Vendas</th><th>Entradas</th><th>Reparos</th></tr></thead><tbody>${days.map(d=>`<tr><td>${fmtDate(d.s)}</td><td>${d.venda}</td><td>${d.entrada}</td><td>${d.reparo}</td></tr>`).join('')}</tbody></table>`);
  if(sm) sm.textContent = `Hoje: ${h.venda} venda(s), ${h.entrada} entrada(s), ${h.reparo} uso(s) em reparo · 14 dias: ${days.reduce((a,d)=>a+d.venda,0)} vendas`;
}
function fitKpis(){
  document.querySelectorAll('.kpi .v[data-f]').forEach(el=>{
    const s = el.nextElementSibling; if(s && s.dataset.s0===undefined) s.dataset.s0 = s.textContent;
    el.textContent = el.dataset.f; if(s) s.textContent = s.dataset.s0;
    if(el.scrollWidth > el.clientWidth + 1){ el.textContent = el.dataset.c; if(s) s.textContent = el.dataset.f+' · '+s.dataset.s0; }
    el.title = el.dataset.f;
  });
}
