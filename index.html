    <div class="head hide-sub"><div><h1>${titulo}</h1><p>${sub}</p></div>
      <div class="actions">${can('editar_produto')?`<button class="btn pri" id="add">${ICON.plus}Cadastrar ${cat==='peca'?'peça':cat==='aparelho'?'aparelho':'acessório'}</button>`:''}</div></div>
    <div class="toolbar">
      <div class="search">${ICON.search}<input class="in" id="fq" type="search" autocomplete="off" aria-label="Buscar" placeholder="Buscar: 17 pro max 256 azul" value="${esc(f.q)}"></div>
      ${extraOpts.length?`<select class="in" id="fx" aria-label="Filtro"><option value="todas">${cat==='aparelho'?'Condição':'Tipo de peça'}</option>${extraOpts.map(o=>`<option ${f.extra===o?'selected':''}>${o}</option>`).join('')}</select>`:''}
      <select class="in" id="fs" aria-label="Situação"><option value="todos">Situação</option><option value="ok" ${f.status==='ok'?'selected':''}>Em estoque</option><option value="alerta" ${f.status==='alerta'?'selected':''}>Baixo ou esgotado</option></select>
    </div>
    ${cat!=='acessorio'?`<div class="chips" id="fl">${['todas',...LINHAS].map(l=>`<button class="chip ${f.linha===l?'on':''}" data-l="${l}" aria-pressed="${f.linha===l}" aria-label="${l==='todas'?'Todas as linhas':'iPhone '+l}">${l==='todas'?'Todos':l}</button>`).join('')}</div>`:''}
    ${!can('ver_custo')?`<div class="lock">${ICON.lock}Seu acesso é de funcionário: custos e edição de cadastro ficam visíveis só para o dono.</div>`:''}
    <div id="tbl"></div>`;
  const draw = () => {
    const q = f.q.trim().toLowerCase();
    let rows = DB.produtos.filter(p=>p.cat===cat);
    if(f.linha!=='todas') rows = rows.filter(p=>p.linha===f.linha);
    if(f.extra!=='todas') rows = rows.filter(p=>cat==='aparelho'?p.condicao===f.extra:p.tipo===f.extra);
    if(f.status==='ok') rows = rows.filter(p=>p.qtd>0); else if(f.status==='alerta') rows = rows.filter(p=>stockState(p)!=='ok');
    if(q) rows = rows.filter(p=>casa(q,[p.nome,p.variante,p.sku,p.local,p.condicao,p.qualidade,p.tipo,p.modelo,p.fornecedor].join(' ')));
    const total = rows.reduce((a,p)=>a+p.qtd,0);
    const custo = can('ver_custo');
    $('#tbl').innerHTML = `<div class="tbl-wrap" tabindex="0"><table class="est">
      <thead><tr><th>Produto</th><th>Qtd.</th>${custo?'<th class="r hide-sm">Custo</th>':''}<th class="r">Preço</th><th class="r"><span class="sr">Ações</span></th></tr></thead>
      <tbody>${rows.map(p=>{
        const sub = [cat==='peca'?p.fornecedor:p.variante, p.local].filter(Boolean).map(esc).join(' · ');
        const tag = cond(p);
        const nm = esc(p.nome+(p.variante?' '+p.variante:''));
        return `<tr>
        <td class="c-prod"><div class="pname">${esc(p.nome)}${tag}${stockPill(p)?' '+stockPill(p):''}</div><div class="psub">${dotCor(p.variante)}${sub?sub+' · ':''}<span class="mono">${esc(p.sku)}</span></div></td>
        <td class="c-qtd"><span class="qty">${p.qtd}</span><span class="sr"> em estoque</span></td>
        ${custo?`<td class="r num hide-sm psub c-custo">${brl(p.custo)}</td>`:''}
        <td class="r num c-preco">${brl(p.preco)}</td>
        <td class="c-acao"><div class="rowact">
          ${can('movimentar')?`<button class="btn sm tint" data-mv="out" data-id="${p.id}" ${p.qtd<=0?'disabled':''} aria-label="${cat==='peca'?'Usar em reparo':'Vender'}: ${nm}">${cat==='peca'?'Usar':'Vender'}</button><button class="btn sm" data-mv="in" data-id="${p.id}" aria-label="Dar entrada: ${nm}">Entrada</button>`:''}
          ${can('editar_produto')?`<button class="btn sm icon ghost" title="Editar" aria-label="Editar ${nm}" data-ed="${p.id}">${ICON.edit}</button>`:''}
        </div></td></tr>`; }).join('') || `<tr><td colspan="5" class="c-vazio"><div class="empty">Nenhum item com esses filtros.<br><button type="button" class="btn sm" id="clr" style="margin-top:12px">Limpar filtros</button></div></td></tr>`}</tbody></table></div>
      <p class="foot">${rows.length} itens · ${fmtN(total)} unidades${custo?` · ${brl(rows.reduce((a,p)=>a+p.qtd*p.preco,0))} a preço de venda`:''}</p>`;
    if($('#clr')) $('#clr').onclick = () => { UI.filtros[cat] = {q:'', linha:'todas', status:'todos', extra:'todas'}; renderEstoque(cat); };
    $('#tbl').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>moveDialog(prod(b.dataset.id), b.dataset.mv==='in'?'entrada':(cat==='peca'?'reparo':'venda'), draw));
    $('#tbl').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>productDialog(cat, prod(b.dataset.ed), draw));
  };
  $('#fq').oninput = e => { f.q = e.target.value; draw(); };
  $('#fs').onchange = e => { f.status = e.target.value; draw(); };
  if($('#fx')) $('#fx').onchange = e => { f.extra = e.target.value; draw(); };
  v.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ f.linha=b.dataset.l; v.querySelectorAll('[data-l]').forEach(x=>{ x.classList.toggle('on',x===b); x.setAttribute('aria-pressed', String(x===b)); }); draw(); });
  if($('#add')) $('#add').onclick = () => productDialog(cat, null, draw);
  draw();
}

function moveDialog(p, tipo, after){
  const tipos = p.cat==='peca' ? ['entrada','reparo','saida','ajuste'] : ['entrada','venda','saida','ajuste'];
  const allowed = tipos.filter(t=>t!=='ajuste' || can('editar_produto'));
  let cur = tipo;
  const TIT = {venda:'Vender', entrada:'Dar entrada', saida:'Registrar saída', reparo:'Usar em reparo', ajuste:'Ajustar contagem'};
  const tag = cond(p);
  const REG = {venda:'Venda registrada',entrada:'Entrada registrada',saida:'Saída registrada',reparo:'Uso em reparo registrado',ajuste:'Ajuste registrado'};
  modal({title:TIT[tipo]||'Movimentar estoque', body:`
    <div class="msum"><div class="row"><div class="pname">${esc(p.nome)}${tag}</div><div class="big num">${brl(p.preco)}</div></div>
      <div class="psub">${dotCor(p.variante)}${esc(p.variante||'')}${p.local?' · '+esc(p.local):''} · <span class="mono">${esc(p.sku)}</span></div>
      <div class="row"><span class="psub">Estoque</span><b class="num" id="mst" aria-live="polite"></b></div></div>
    <div class="seg" id="mt" role="group" aria-label="Tipo de movimentação">${allowed.map(t=>`<button type="button" data-t="${t}" class="${t===cur?'on':''}" aria-pressed="${t===cur}">${MOV[t][0]}</button>`).join('')}</div>
    <div class="f"><span class="flab" id="ql">Quantidade</span><div class="stepper"><button type="button" class="btn icon" data-st="-1" aria-label="Menos um">${ICON.minus}</button><input class="in" id="mq" type="number" min="0" value="1" inputmode="numeric" aria-labelledby="ql"><button type="button" class="btn icon" data-st="1" aria-label="Mais um">${ICON.plus}</button></div></div>
    <label class="f">Observação<input class="in" id="mo" placeholder="ex.: nota fiscal 2231, cliente..."></label>
    <div class="err" id="me" role="alert"></div>`,
    foot:`<button class="btn" data-x>Cancelar</button><button class="btn pri" id="mok">Confirmar</button>`,
    onMount:(el,close)=>{
      const qv = () => { const n = parseInt($('#mq',el).value,10); return isNaN(n)?0:n; };
      const dlt = () => cur==='entrada' ? qv() : cur==='ajuste' ? qv()-p.qtd : -qv();
      const sync = () => {
        el.querySelectorAll('[data-t]').forEach(b=>{ b.classList.toggle('on',b.dataset.t===cur); b.setAttribute('aria-pressed', String(b.dataset.t===cur)); });
        $('#ql',el).textContent = cur==='ajuste'?'Nova quantidade (contagem)':'Quantidade';
        el.querySelector('.modal-h h2').textContent = TIT[cur];
        const n = qv();
        $('#mst',el).textContent = `${p.qtd} → ${p.qtd + dlt()}`;
        const ok = $('#mok',el); ok.className = 'btn ' + (cur==='venda'?'pri':cur==='entrada'?'ok':'dark');
        const out = cur==='venda'||cur==='saida'||cur==='reparo';
        const bad = (n===0 && cur!=='ajuste') || (cur==='ajuste' && dlt()===0) || (out && n>p.qtd);
        ok.disabled = bad;
        $('#me',el).textContent = out && n>p.qtd ? `Só há ${p.qtd} em estoque.` : '';
        const plus = el.querySelector('[data-st="1"]'); if(plus) plus.disabled = out && n>=p.qtd;
        ok.textContent = cur==='venda' ? `Vender ${n} · ${brl(n*p.preco)}` : cur==='entrada' ? `Dar entrada de ${n}` : cur==='ajuste' ? `Ajustar para ${n}` : cur==='reparo' ? `Usar ${n} em reparo` : `Registrar saída de ${n}`;
      };
      el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const era = cur; cur=b.dataset.t; if(cur==='ajuste') $('#mq',el).value = p.qtd; else if(era==='ajuste') $('#mq',el).value = 1; sync(); });
      el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ $('#mq',el).value = Math.max(0, qv()+(+b.dataset.st)); sync(); });
      $('#mq',el).addEventListener('input', sync);
      sync();
      $('#mok',el).onclick=()=>{
        const raw = $('#mq',el).value, q = parseInt(raw,10);
        if(isNaN(q) || q<0 || String(q)!==String(raw).trim() || (q===0 && cur!=='ajuste')){ $('#me',el).textContent='Informe uma quantidade válida, em número inteiro.'; return; }
        const delta = dlt();
        if(p.qtd + delta < 0){ $('#me',el).textContent=`Só há ${p.qtd} em estoque.`; return; }
        p.qtd += delta;
        const mov = {id:uid(),ts:Date.now(),prodId:p.id,tipo:cur,qtd:Math.abs(delta),delta,cond:p.condicao||'',obs:$('#mo',el).value.trim()||MOV[cur][0],userId:currentUser().id};
        DB.movs.unshift(mov);
        save(); close();
        const undo = () => {
          const i = DB.movs.indexOf(mov); if(i<0) return;
          if(p.qtd - delta < 0){ toast('Não dá para desfazer: o estoque atual não permite.'); return; }
          p.qtd -= delta; DB.movs.splice(i,1); save(); toast('Lançamento desfeito'); render();
        };
        toast(`${REG[cur]} · ${p.nome}${p.variante?' · '+p.variante:''}${p.condicao?' · '+p.condicao:''} · estoque ${p.qtd}`, undo);
        after ? after() : render();
      };
    }});
}

function pickProduct(tipo){
  modal({title: tipo==='venda'?'Vender':'Dar entrada', body:`
    <div class="toolbar"><div class="search">${ICON.search}<input class="in" id="pq" type="search" autocomplete="off" aria-label="Buscar produto" placeholder="Ex.: 17 pro max 256 azul"></div></div>
    <div class="list" id="pl" style="max-height:min(420px,52vh);overflow:auto"></div><p class="foot" id="pn" style="margin:0"></p>`,
    onMount:(el,close)=>{
      const draw = () => {
        const q = $('#pq',el).value;
        let rows = DB.produtos.filter(p=>p.cat!=='peca' || tipo==='entrada');
        if(q.trim()) rows = rows.filter(p=>casa(q,[p.nome,p.variante,p.sku,p.local,p.condicao,p.qualidade,p.tipo,p.modelo].join(' ')));
        if(tipo==='venda') rows = [...rows.filter(p=>p.qtd>0), ...rows.filter(p=>p.qtd<=0)];
        const vis = rows.slice(0,40);
        $('#pl',el).innerHTML = vis.map(p=>{
          const out = tipo==='venda' && p.qtd<=0;
          const partes = String(p.variante||'').split(' · '); const aparelho = p.cat==='aparelho';
          const titulo = aparelho ? `${esc(p.nome)} · ${esc(partes[0]).replace(' ','&nbsp;')}` : esc(p.nome);
          const linha2 = aparelho ? `${dotCor(p.variante)}${esc(partes.slice(1).join(' · '))}${cond(p)}` : `${esc(p.variante||CAT[p.cat])}${cond(p)}`;
          return `<button type="button" class="li" data-p="${p.id}" ${out?'disabled':''}><div class="grow"><div class="t" style="font-size:16px">${titulo}</div><div class="d">${linha2}</div><div class="d">${p.local?esc(p.local)+' · ':''}${out?'<b>Esgotado</b>':p.qtd+' em estoque'}</div></div><span class="num" style="font-size:17px;font-weight:700">${brl(p.preco)}</span></button>`;
        }).join('') || '<div class="empty">Nada encontrado. Tente menos palavras.</div>';
        $('#pn',el).textContent = rows.length>40 ? `Mostrando 40 de ${rows.length} · refine a busca` : `${rows.length} ${rows.length===1?'item':'itens'}`;
        el.querySelectorAll('[data-p]').forEach(r=>r.onclick=()=>{ close(); moveDialog(prod(r.dataset.p), tipo); });
      };
      $('#pq',el).oninput = draw; draw();
    }});
}

function productDialog(cat, p, after){
  const novo = !p;
  p = p || {cat, nome: cat==='aparelho'?MODELOS[0][0]:'', variante:'', condicao:'Novo', qualidade:'Original Apple', tipo:'Tela', modelo:MODELOS[4][0], qtd:0, min:2, custo:0, preco:0, local:'', fornecedor:''};
  const modelSel = (id,val) => `<select class="in" id="${id}">${MODELOS.map(m=>`<option ${m[0]===val?'selected':''}>${m[0]}</option>`).join('')}</select>`;
  const body = `
    ${cat==='aparelho'?`<label class="f">Modelo${modelSel('pn',p.nome)}</label>
      <div class="grid2"><label class="f">Capacidade e cor<input class="in" id="pv" value="${esc(p.variante)}" placeholder="256 GB · Azul"></label>
      <label class="f">Condição<select class="in" id="pc"><option ${p.condicao==='Novo'?'selected':''}>Novo</option><option ${p.condicao==='Seminovo'?'selected':''}>Seminovo</option></select></label></div>`
    : cat==='peca'?`<div class="grid2"><label class="f">Tipo de peça<select class="in" id="pt">${PECA_TIPOS.map(t=>`<option ${t[0]===p.tipo?'selected':''}>${t[0]}</option>`).join('')}</select></label>
      <label class="f">Compatível com${modelSel('pm',p.modelo)}</label></div>
      <label class="f">Qualidade<select class="in" id="pqq">${PECA_QUAL.map(q=>`<option ${q[0]===p.qualidade?'selected':''}>${q[0]}</option>`).join('')}</select></label>`
    : `<label class="f">Nome<input class="in" id="pn" value="${esc(p.nome)}" placeholder="ex.: Capa MagSafe transparente"></label>`}
    <div class="grid3"><label class="f">Quantidade<input class="in" id="pqt" type="number" min="0" value="${p.qtd}" ${novo?'':'disabled'}></label>
      <label class="f">Estoque mínimo<input class="in" id="pmin" type="number" min="0" value="${p.min}"></label>
      <label class="f">Local<input class="in" id="pl" value="${esc(p.local)}" placeholder="Gaveta B3"></label></div>
    <div class="grid3"><label class="f">Custo (R$)<input class="in" id="pcu" type="number" min="0" value="${p.custo}"></label>
      <label class="f">Preço de venda (R$)<input class="in" id="ppr" type="number" min="0" value="${p.preco}"></label>
      <label class="f">Fornecedor<input class="in" id="pf" value="${esc(p.fornecedor)}"></label></div>
    ${novo?'':'<p class="foot" style="margin:0">Para mudar a quantidade use Entrada, Saída ou Ajuste, assim fica registrado no histórico.</p>'}
    <div class="err" id="pe" role="alert"></div>`;
  modal({title: novo?'Cadastrar item':'Editar item', body,
    foot:`${novo?'':`<button class="btn danger" id="pdel" style="margin-right:auto">${ICON.trash}Excluir</button>`}<button class="btn" data-x>Cancelar</button><button class="btn pri" id="psave">Salvar</button>`,
    onMount:(el,close)=>{
      $('#psave',el).onclick=()=>{
        const g = id => $('#'+id,el)?.value;
        const n = {...p};
        if(cat==='aparelho'){ n.nome=g('pn'); n.variante=g('pv').trim(); n.condicao=g('pc'); n.linha=(MODELOS.find(m=>m[0]===n.nome)||[])[4]; }
        else if(cat==='peca'){ n.tipo=g('pt'); n.modelo=g('pm'); n.qualidade=n.variante=g('pqq'); n.nome=`${n.tipo} ${n.modelo}`; n.linha=(MODELOS.find(m=>m[0]===n.modelo)||[])[4]; }
        else { n.nome=g('pn').trim(); }
        if(!n.nome){ $('#pe',el).textContent='Informe o nome.'; return; }
        n.min=+g('pmin')||0; n.local=g('pl').trim(); n.custo=+g('pcu')||0; n.preco=+g('ppr')||0; n.fornecedor=g('pf').trim();
        const qtdNova = novo ? (+g('pqt')||0) : 0;
        if(n.min<0 || n.custo<0 || qtdNova<0 || !Number.isInteger(n.min) || !Number.isInteger(qtdNova)){ $('#pe',el).textContent='Quantidade e mínimo devem ser números inteiros, a partir de zero. Custo não pode ser negativo.'; return; }
        if(!(n.preco>0)){ $('#pe',el).textContent='Informe o preço de venda, maior que zero.'; return; }
        if(novo){
          n.qtd=+g('pqt')||0; n.id=uid(); n.sku={aparelho:'AP-',peca:'PC-',acessorio:'AC-'}[cat]+(Math.max(0,...DB.produtos.filter(x=>x.cat===cat).map(x=>parseInt(String(x.sku).replace(/\D/g,''),10)||0))+1);
          DB.produtos.unshift(n);
          if(n.qtd) DB.movs.unshift({id:uid(),ts:Date.now(),prodId:n.id,tipo:'entrada',qtd:n.qtd,obs:'Cadastro inicial',userId:currentUser().id});
        } else Object.assign(p,n);
        save(); close(); toast(novo?'Item cadastrado':'Alterações salvas'); after();
      };
      if(!novo) $('#pdel',el).onclick=()=>{ close(); confirmBox('Excluir item?', `${p.nome} ${p.variante||''} sai do cadastro. O histórico de movimentações é mantido.`, 'Excluir', ()=>{ DB.produtos = DB.produtos.filter(x=>x!==p); save(); toast('Item excluído'); after(); }); };
    }});
}

/* ---------- ordens de serviço ----------
   Fluxo: Recebido → Diagnóstico → (Aguardando peça) → Reparo → Pronto para retirada → Entregue.
   A OS abre só com o defeito relatado. O técnico define as peças no diagnóstico;
   cada peça sai do estoque quando é adicionada. Entregar é uma ação separada, com confirmação. */
const osPecas = o => o.pecas || [];
const OS_LABEL = {'Recebido':'Na fila','Em diagnóstico':'Em diagnóstico','Aguardando peça':'Aguardando peça','Em reparo':'Em reparo','Pronto':'Pronto para retirada','Entregue':'Entregue'};
const OS_NEXT_TXT = {'Recebido':'Começar diagnóstico','Em diagnóstico':'Concluir diagnóstico','Aguardando peça':'Dar baixa na peça quando chegar','Em reparo':'Concluir reparo','Pronto':'Entregar ao cliente'};
function stepIdx(o){ return o.status==='Aguardando peça' ? 2 : OS_FLOW.indexOf(o.status); }
function miniSteps(o){ const k = stepIdx(o); return `<span class="mini" aria-label="Etapa ${k+1} de ${OS_FLOW.length}">${OS_FLOW.map((_,i)=>`<b class="${i<k||o.status==='Entregue'?'on':i===k?(o.status==='Aguardando peça'?'wait':'cur'):''}"></b>`).join('')}</span>`; }
function osSteps(o){
  const k = stepIdx(o), entregue = o.status==='Entregue';
  const nomes = ['Recebido','Diagnóstico','Reparo','Pronto','Entregue'];
  return `<div class="steps">${nomes.map((st,i)=>{ const wait = i===2 && o.status==='Aguardando peça'; const cls = i<k || entregue ? 'done' : i===k ? (wait?'wait':'cur') : ''; return `<div class="step ${cls}"><i>${cls==='done'?ICON.check:i+1}</i><span>${wait?'Aguard. peça':st}</span></div>`; }).join('')}</div>`;
}
function pecaLabel(x){ const p = prod(x.prodId); return p ? p.tipo : (x.tipo||'Peça'); }
function osAdvance(o, to){ if(to==='Em diagnóstico' && !o.tecnicoId) o.tecnicoId = currentUser().id; (o.hist ||= []).push({status:to, ts:Date.now(), userId:currentUser().id}); o.status = to; save(); toast(`OS ${o.num} · ${OS_LABEL[to]}`); }
function flashOS(id){ const c = document.getElementById('os-'+id); if(c){ c.classList.add('flash'); c.scrollIntoView({block:'nearest', behavior:'smooth'}); } }
const refreshView = () => { const r = ROUTES.find(r=>r.id===UI.route); r && r.render(); };

function renderOS(){
  const v = $('#view');
  const abertas = DB.os.filter(o=>!['Pronto','Entregue'].includes(o.status)).sort((a,b)=>a.num-b.num);
  const prontas = DB.os.filter(o=>o.status==='Pronto').sort((a,b)=>a.num-b.num);
  const entregues = DB.os.filter(o=>o.status==='Entregue').sort((a,b)=>b.num-a.num).slice(0,6);
  v.innerHTML = `
    <div class="head hide-sub"><div><h1>Ordens de serviço</h1><p>Toque numa OS para trabalhar nela.</p></div>
      <div class="actions">${can('criar_os')?`<button class="btn pri" id="nos">${ICON.plus}Nova OS</button>`:''}</div></div>
    <section class="stack"><h2 class="sech">Em andamento <span class="num">${abertas.length}</span></h2>
      <div class="queue">${abertas.map(osRow).join('')||'<div class="empty card">Nenhum reparo em andamento.</div>'}</div></section>
    <section class="stack"><h2 class="sech">Prontos para retirada <span class="num">${prontas.length}</span></h2>
      <div class="queue">${prontas.map(osRow).join('')||'<div class="empty card">Nenhum aparelho aguardando o cliente.</div>'}</div></section>
    <div class="card"><div class="card-h"><h2>Entregues recentemente</h2></div><div class="list">${entregues.map(o=>`<button type="button" class="li" data-os="${o.id}"><div class="ic in-">${ICON.check}</div><div class="grow"><div class="t">OS ${o.num} · ${esc(o.cliente)}</div><div class="d">${esc(o.aparelho)} · ${esc(osPecas(o).map(pecaLabel).join(', ')||o.defeito)}</div></div><span class="num">${brl(o.valor)}</span></button>`).join('')||'<div class="empty">Nenhuma ainda.</div>'}</div></div>`;
  v.querySelectorAll('[data-os]').forEach(c=>c.onclick=()=>osDialog(DB.os.find(o=>o.id===c.dataset.os)));
  if($('#nos')) $('#nos').onclick=()=>osDialog(null);
}
function osRow(o){
  const pend = osPecas(o).some(x=>x.pendente);
  return `<button type="button" class="os orow" data-os="${o.id}" id="os-${o.id}">
    <div class="orow-h"><div style="min-width:0"><span class="n">OS ${o.num} · ${fmtDate(o.ts)}${o.tecnicoId?` · ${esc(userName(o.tecnicoId).split(' ')[0])}`:''}</span>
      <div class="c">${esc(o.cliente)} · ${esc(o.aparelho)}</div><div class="a">${esc(o.defeito)}</div></div>
      <span class="pill ${OS_PILL[o.status]}">${OS_LABEL[o.status]}</span></div>
    <div class="nx">Próximo passo → <b>${OS_NEXT_TXT[o.status]}</b>${pend?' · <span style="color:var(--warn)">peça encomendada</span>':''}</div>
  </button>`;
}

function osDialog(o, aviso){
  if(!o){
    modal({title:'Nova ordem de serviço', body:`
      <div class="grid2"><label class="f">Cliente<input class="in" id="oc"></label><label class="f">Telefone<input class="in" id="ot" inputmode="tel"></label></div>
      <label class="f">Aparelho<select class="in" id="oa">${MODELOS.map(m=>`<option ${m[0]==='iPhone 13'?'selected':''}>${m[0]}</option>`).join('')}</select></label>
      <label class="f">O que o cliente relatou<textarea class="in" id="od" placeholder="ex.: está esquentando e descarregando rápido"></textarea></label>
      <p class="psub" style="margin:0">A peça é definida depois, pelo técnico, no diagnóstico.</p>
      <div class="err" id="oe" role="alert"></div>`,
      foot:`<button class="btn" data-x>Cancelar</button><button class="btn pri" id="osave">Abrir OS</button>`,
      onMount:(el,close)=>{ $('#osave',el).onclick=()=>{
        const n = {cliente:$('#oc',el).value.trim(), telefone:$('#ot',el).value.trim(), aparelho:$('#oa',el).value, defeito:$('#od',el).value.trim()};
        if(!n.cliente){ $('#oe',el).textContent='Informe o nome do cliente.'; return; }
        if(!n.defeito){ $('#oe',el).textContent='Descreva o que o cliente relatou.'; return; }
        const nova = {...n, id:uid(), num:++DB.osSeq, ts:Date.now(), status:'Recebido', diagnostico:'', pecas:[], valor:0, userId:currentUser().id, hist:[{status:'Recebido',ts:Date.now(),userId:currentUser().id}]};
        DB.os.unshift(nova); save(); close(); toast(`OS ${nova.num} aberta`); refreshView(); flashOS(nova.id);
      }; }});
    return;
  }
  o.pecas = osPecas(o);
  o.hist ||= [{status:o.status, ts:o.ts, userId:o.userId}];
  const st = o.status, editar = can('criar_os');
  const pend = () => o.pecas.some(x=>x.pendente);
  const partsBlock = (addLabel, aberto) => `<div id="opl"></div>${editar?`<details class="addbox" ${aberto?'open':''}><summary>${ICON.plus.replace('<svg','<svg style="width:15px;height:15px"')} ${addLabel}</summary>
      <div class="stack" style="gap:8px;padding-top:10px"><input class="in" id="opf" placeholder="Buscar componente: bateria, auricular, flex, CI...">
      <div class="addp"><select class="in" id="op" aria-label="Componente"></select><input class="in" id="opq" type="number" min="1" value="1" aria-label="Quantidade"><button class="btn" id="opadd">Adicionar</button></div></div></details>`:''}`;
  let panel = '';
  if(st==='Recebido') panel = `<p class="ptxt">O aparelho está na fila. Quando for analisar, comece o diagnóstico.</p>
      ${editar?`<button class="btn pri block" id="act">${ICON.check}Começar diagnóstico</button>`:''}`;
  else if(st==='Em diagnóstico') panel = `<label class="f">O que você encontrou?<textarea class="in" id="odg" placeholder="ex.: bateria com 70% de saúde, conector oxidado">${esc(o.diagnostico||'')}</textarea></label>
      <div class="f"><span class="flab">Peças para a troca</span>${partsBlock('Adicionar peça', !o.pecas.length)}</div>
      ${editar?`<button class="btn pri block" id="act">${ICON.check}Concluir diagnóstico</button><p class="psub" style="margin:0">Se alguma peça estiver encomendada, a OS vai para "Aguardando peça". Se não, vai direto para o reparo.</p>`:''}`;
  else if(st==='Aguardando peça') panel = `<p class="ptxt">Quando a peça chegar, dê entrada nela em <b>Peças</b> e depois toque em <b>Dar baixa</b> aqui.</p>
      <div class="f"><span class="flab">Peças</span>${partsBlock('Adicionar outra peça', false)}</div>
      ${editar?`<button class="btn pri block" id="act">${ICON.check}Iniciar reparo</button>`:''}`;
  else if(st==='Em reparo') panel = `${o.diagnostico?`<p class="ptxt"><b>Diagnóstico:</b> ${esc(o.diagnostico)}</p>`:''}
      <div class="f"><span class="flab">Peças usadas</span>${partsBlock('Precisou de outra peça?', false)}</div>
      <label class="f">Valor a cobrar do cliente (R$)<input class="in" id="ov" type="number" min="0" value="${o.valor||''}" placeholder="peças + mão de obra"></label>
      ${editar?`<button class="btn pri block" id="act">${ICON.check}Concluir reparo</button><p class="psub" style="margin:0">Depois disso o aparelho fica pronto para retirada.</p>`:''}`;
  else if(st==='Pronto') panel = `<p class="ptxt">Reparo concluído. O aparelho está aguardando o cliente retirar.</p>
      <div class="kv"><dt>Serviço</dt><dd>${esc(o.pecas.map(pecaLabel).join(', ')||o.diagnostico||'—')}</dd><dt>Técnico</dt><dd>${esc(userName(o.tecnicoId))}</dd></div>
      <label class="f">Valor a cobrar do cliente (R$)<input class="in" id="ov" type="number" min="0" value="${o.valor||''}"></label>
      ${editar?`<div id="entbox"><button class="btn block" id="act">Entregar ao cliente</button></div>`:''}`;
  else panel = `<p class="ptxt" style="color:var(--ok)"><b>Entregue ao cliente</b> em ${fmtDT(o.hist[o.hist.length-1].ts)}.</p>
      <div class="kv"><dt>Diagnóstico</dt><dd>${esc(o.diagnostico||'—')}</dd><dt>Peças</dt><dd>${esc(o.pecas.map(pecaLabel).join(', ')||'—')}</dd><dt>Técnico</dt><dd>${esc(userName(o.tecnicoId))}</dd><dt>Valor</dt><dd>${brl(o.valor)}</dd></div>`;

  modal({title:`OS ${o.num}`, body:`
    <div class="oshead"><div style="min-width:0"><div class="c">${esc(o.cliente)} · ${esc(o.aparelho)}</div><div class="psub">Relatado: ${esc(o.defeito)}</div></div><span class="pill ${OS_PILL[st]}">${OS_LABEL[st]}</span></div>
    ${osSteps(o)}
    <div class="panel">${panel}<div class="err" id="oke" role="alert">${esc(aviso||'')}</div></div>
    <details class="more"><summary>Dados da OS e histórico</summary><div class="stack" style="gap:10px;padding-top:10px">
      <div class="grid2"><label class="f">Cliente<input class="in" id="oc" value="${esc(o.cliente)}"></label><label class="f">Telefone<input class="in" id="ot" value="${esc(o.telefone)}" inputmode="tel"></label></div>
      <label class="f">O que o cliente relatou<textarea class="in" id="od">${esc(o.defeito)}</textarea></label>
      <label class="f">Técnico responsável<select class="in" id="otec"><option value="">Ainda não definido</option>${DB.users.filter(u=>u.ativo||u.id===o.tecnicoId).map(u=>`<option value="${u.id}" ${u.id===o.tecnicoId?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></label>
      <div class="hist">${o.hist.slice().reverse().map(h=>`<div>${ICON.check.replace('<svg','<svg style="width:13px;height:13px;flex:none;color:var(--ok)"')}<b>${esc(OS_LABEL[h.status]||h.status)}</b><span>${esc(userName(h.userId))} · ${fmtDT(h.ts)}</span></div>`).join('')}</div>
    </div></details>`,
    foot:`<button class="btn" data-x>Fechar</button>`,
    onMount:(el,close)=>{
      const stockFor = (tipo, q=1) => DB.produtos.filter(p=>p.cat==='peca' && p.modelo===o.aparelho && p.tipo===tipo && p.qtd>=q).sort((a,b)=>b.qtd-a.qtd)[0];
      const escolhida = x => { const c = x.prodId && prod(x.prodId); return c ? (c.qtd>=x.qtd ? c : null) : stockFor(x.tipo, x.qtd); };
      const baixa = (p, q) => { p.qtd -= q; DB.movs.unshift({id:uid(),ts:Date.now(),prodId:p.id,tipo:'reparo',qtd:q,obs:`OS ${o.num} · ${o.cliente}`,userId:currentUser().id}); };
      const err = t => { $('#oke',el).textContent = t||''; };
      const keep = () => {
        if($('#odg',el)) o.diagnostico = $('#odg',el).value.trim();
        if($('#ov',el)) o.valor = +$('#ov',el).value || 0;
        o.cliente = $('#oc',el).value.trim() || o.cliente; o.telefone = $('#ot',el).value.trim(); o.defeito = $('#od',el).value.trim() || o.defeito;
        o.tecnicoId = $('#otec',el).value || o.tecnicoId || null;
        save();
      };
      el.querySelectorAll('#odg,#ov,#oc,#ot,#od,#otec').forEach(i=>i.addEventListener('change', keep));
      const drawPecas = () => {
        if(!$('#opl',el)) return;
        $('#opl',el).innerHTML = o.pecas.length ? `<div class="list">${o.pecas.map((x,i)=>{ const p = prod(x.prodId);
            if(x.pendente){ const disp = escolhida(x); return `<div class="li"><div class="ic rep">${ICON.peca}</div><div class="grow"><div class="t">${esc(x.tipo)}</div><div class="d" style="color:var(--warn)">Encomendada · ${disp?'já tem no estoque':'ainda sem estoque'}</div></div>${editar?`${disp?`<button class="btn sm pri" data-bx="${i}">Dar baixa</button>`:''}<button class="btn sm icon ghost" aria-label="Remover" data-rm="${i}">${ICON.trash}</button>`:''}</div>`; }
            return `<div class="li"><div class="ic in-">${ICON.check}</div><div class="grow"><div class="t">${esc(p?p.tipo:'Peça removida')}${x.qtd>1?` ×${x.qtd}`:''}</div><div class="d">${esc(p?.qualidade||'')} · saiu do estoque</div></div>${editar&&st!=='Entregue'?`<button class="btn sm icon ghost" aria-label="Remover e devolver ao estoque" title="Remover e devolver ao estoque" data-rm="${i}">${ICON.trash}</button>`:''}</div>`; }).join('')}</div>`
          : `<p class="psub" style="margin:0">Nenhuma peça ainda.</p>`;
        el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
          const x = o.pecas[+b.dataset.rm]; const p = !x.pendente && prod(x.prodId);
          if(p){ p.qtd += x.qtd; DB.movs.unshift({id:uid(),ts:Date.now(),prodId:p.id,tipo:'entrada',qtd:x.qtd,obs:`Devolvida da OS ${o.num}`,userId:currentUser().id}); }
          o.pecas.splice(+b.dataset.rm,1); save(); drawPecas(); fillSel(); toast(p?'Peça devolvida ao estoque':'Peça removida');
        });
        el.querySelectorAll('[data-bx]').forEach(b=>b.onclick=()=>{
          const x = o.pecas[+b.dataset.bx]; const p = escolhida(x);
          if(!p){ err('A peça escolhida ainda não tem estoque. Dê entrada nela em Peças.'); return; }
          baixa(p, x.qtd); Object.assign(x,{prodId:p.id, pendente:false, ts:Date.now(), userId:currentUser().id});
          save(); drawPecas(); fillSel(); err(); toast(`${p.tipo} saiu do estoque`);
        });
      };
      const fillSel = () => {
        if(!$('#op',el)) return;
        const f = ($('#opf',el).value||'').trim().toLowerCase();
        $('#op',el).innerHTML = PECA_TIPOS.map(t=>t[0]).filter(t=>!f || t.toLowerCase().includes(f)).map(t=>{
          const items = DB.produtos.filter(p=>p.cat==='peca' && p.modelo===o.aparelho && p.tipo===t);
          const opts = items.map(p=>`<option value="${p.id}">${esc(t)} · ${esc(p.qualidade)} · ${p.qtd>0?p.qtd+' em estoque':'sem estoque'}</option>`).join('');
          return `<optgroup label="${esc(t)}">${opts || `<option value="tipo:${esc(t)}">${esc(t)} · sem cadastro (encomendar)</option>`}</optgroup>`;
        }).join('') || '<option value="">Nenhum componente com esse nome</option>';
      };
      drawPecas(); fillSel();
      if($('#opf',el)) $('#opf',el).oninput = fillSel;
      if($('#opadd',el)) $('#opadd',el).onclick = () => {
        err();
        const val = $('#op',el).value; const q = parseInt($('#opq',el).value,10)||0;
        if(!val){ err('Escolha um componente.'); return; }
        if(q<1){ err('Informe a quantidade.'); return; }
        const p = val.startsWith('tipo:') ? null : prod(val);
        if(!p || p.qtd < q){
          const tipo = p ? p.tipo : val.slice(5);
          o.pecas.push({tipo, prodId:p?.id||null, qtd:q, pendente:true, ts:Date.now(), userId:currentUser().id});
          save(); drawPecas(); fillSel(); toast(`${tipo} sem estoque: marcada como encomendada`); return;
        }
        baixa(p, q); o.pecas.push({prodId:p.id,qtd:q,ts:Date.now(),userId:currentUser().id});
        if($('#ov',el) && !+$('#ov',el).value) $('#ov',el).value = o.pecas.reduce((s,x)=>s+(prod(x.prodId)?.preco||0)*x.qtd,0) + 60;
        save(); drawPecas(); fillSel(); toast(`${p.tipo} saiu do estoque`);
      };
      const reopen = () => { keep(); close(); refreshView(); flashOS(o.id); osDialog(o); };
      const act = $('#act',el); if(!act) return;
      act.onclick = () => {
        keep();
        if(st==='Recebido'){ osAdvance(o,'Em diagnóstico'); return reopen(); }
        if(st==='Em diagnóstico'){
          if(!o.diagnostico){ err('Escreva o que você encontrou antes de concluir o diagnóstico.'); $('#odg',el).focus(); return; }
          if(!o.valor) o.valor = o.pecas.reduce((s,x)=>s+(prod(x.prodId)?.preco||0)*x.qtd,0) + (o.pecas.length?60:80);
          osAdvance(o, pend() ? 'Aguardando peça' : 'Em reparo'); return reopen();
        }
        if(st==='Aguardando peça'){ if(pend()){ err('Ainda há peça encomendada. Dê baixa nela quando chegar.'); return; } osAdvance(o,'Em reparo'); return reopen(); }
        if(st==='Em reparo'){
          if(pend()){ err('Há peça encomendada que ainda não chegou.'); return; }
          if(!o.valor){ err('Informe o valor a cobrar do cliente.'); $('#ov',el).focus(); return; }
          osAdvance(o,'Pronto'); return reopen();
        }
        if(st==='Pronto'){
          if(!o.valor){ err('Informe o valor a cobrar do cliente.'); return; }
          $('#entbox',el).innerHTML = `<div class="confirm"><span>Confirmar entrega para <b>${esc(o.cliente)}</b> no valor de <b>${brl(o.valor)}</b>?</span><div style="display:flex;gap:8px"><button class="btn" id="entno">Cancelar</button><button class="btn pri" id="entok">${ICON.check}Confirmar entrega</button></div></div>`;
          $('#entno',el).onclick = () => { close(); osDialog(o); };
          $('#entok',el).onclick = () => { keep(); osAdvance(o,'Entregue'); close(); refreshView(); };
        }
      };
      el.addEventListener('click', e => { if(e.target===el || e.target.closest('[data-x]')){ keep(); refreshView(); } });
    }});
}

/* ---------- movimentações ---------- */
function renderMovs(){
  const v = $('#view');
  const f = UI.filtros.movs ||= {tipo:'todos', q:''};
  v.innerHTML = `<div class="head"><div><h1>Movimentações</h1><p>Histórico de tudo que entrou e saiu, com quem registrou.</p></div></div>
    <div class="toolbar"><div class="search">${ICON.search}<input class="in" id="mq" placeholder="Buscar produto, pessoa ou observação" value="${esc(f.q)}"></div>
    <select class="in" id="mt" aria-label="Tipo"><option value="todos">Todos os tipos</option>${Object.keys(MOV).map(k=>`<option value="${k}" ${f.tipo===k?'selected':''}>${MOV[k][0]}</option>`).join('')}</select></div>
    <div id="mtb"></div>`;
  const draw = () => {
    const q = f.q.toLowerCase().trim();
    let rows = DB.movs.filter(m=>f.tipo==='todos'||m.tipo===f.tipo);
    if(q) rows = rows.filter(m=>{ const p = prod(m.prodId)||{}; return casa(q,[p.nome,p.variante,m.cond,userName(m.userId),m.obs].join(' ')); });
    $('#mtb').innerHTML = `<div class="tbl-wrap" tabindex="0"><table><thead><tr><th>Quando</th><th>Produto</th><th>Tipo</th><th class="r">Qtd.</th><th class="hide-sm">Por</th><th class="hide-sm">Observação</th></tr></thead><tbody>
      ${rows.slice(0,150).map(m=>{ const p = prod(m.prodId); const [lab] = MOV[m.tipo]||MOV.ajuste; return `<tr><td class="num psub" style="white-space:nowrap">${fmtDT(m.ts)}</td><td><div class="pname">${esc(p?p.nome:'Produto removido')}</div><div class="psub">${esc(p?.variante||'')}${movCond(m)}</div></td><td><span class="pill ${m.tipo==='entrada'?'ok':m.tipo==='reparo'?'warn':'info'} nodot">${lab}</span></td><td class="r num"><b>${sinal(m)}${m.qtd}</b></td><td class="hide-sm">${esc(userName(m.userId))}</td><td class="hide-sm psub">${esc(m.obs)}</td></tr>`; }).join('') || '<tr><td colspan="6"><div class="empty">Nada encontrado.</div></td></tr>'}
    </tbody></table></div><p class="foot">${rows.length} registros${rows.length>150?' · mostrando os 150 mais recentes':''}</p>`;
  };
  $('#mq').oninput = e => { f.q = e.target.value; draw(); };
  $('#mt').onchange = e => { f.tipo = e.target.value; draw(); };
  draw();
}

/* ---------- relatórios (dono) ---------- */
function renderRel(){
  const v = $('#view'); const P = DB.produtos;
  const byCat = ['aparelho','peca','acessorio'].map(c=>{ const a = P.filter(p=>p.cat===c); return {c, un:a.reduce((s,p)=>s+p.qtd,0), custo:a.reduce((s,p)=>s+p.qtd*p.custo,0), venda:a.reduce((s,p)=>s+p.qtd*p.preco,0)}; });
  const tot = byCat.reduce((a,b)=>({custo:a.custo+b.custo, venda:a.venda+b.venda}),{custo:0,venda:0});
  const since = Date.now()-14*DAY;
  const vendas = DB.movs.filter(m=>m.tipo==='venda' && m.ts>=since);
  const fat = vendas.reduce((s,m)=>s+(prod(m.prodId)?.preco||0)*m.qtd,0);
  const lucro = vendas.reduce((s,m)=>{ const p=prod(m.prodId); return s+((p?.preco||0)-(p?.custo||0))*m.qtd; },0);
  const top = {}; vendas.forEach(m=>{ const p = prod(m.prodId); if(p) top[p.nome]=(top[p.nome]||0)+m.qtd; });
  const topL = Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxT = Math.max(1,...topL.map(t=>t[1]));
  const linhas = LINHAS.map(l=>({l, un:P.filter(p=>p.cat==='aparelho'&&p.linha===l).reduce((s,p)=>s+p.qtd,0)}));
  const maxL = Math.max(1,...linhas.map(x=>x.un));
  const porUser = DB.users.map(u=>({u, n:DB.movs.filter(m=>m.userId===u.id && m.ts>=since).length})).sort((a,b)=>b.n-a.n);
  v.innerHTML = `<div class="head"><div><h1>Relatórios</h1><p>Visão financeira do estoque e das vendas dos últimos 14 dias. Só o dono vê esta tela.</p></div></div>
    <div class="kpis">
      <div class="kpi hero"><span class="l">Estoque a preço de venda</span><span class="v" title="${brl(tot.venda)}">${brlC(tot.venda)}</span><span class="s">Custo ${brl(tot.custo)}</span></div>
      <div class="kpi"><span class="l">Margem potencial</span><span class="v" title="${brl(tot.venda-tot.custo)}">${brlC(tot.venda-tot.custo)}</span><span class="s">${Math.round((1-tot.custo/Math.max(1,tot.venda))*100)}% sobre a venda</span></div>
      <div class="kpi"><span class="l">Vendas · 14 dias</span><span class="v" title="${brl(fat)}">${brlC(fat)}</span><span class="s">${vendas.length} vendas registradas</span></div>
      <div class="kpi"><span class="l">Lucro bruto · 14 dias</span><span class="v" style="color:var(--ok)" title="${brl(lucro)}">${brlC(lucro)}</span><span class="s">Venda menos custo</span></div>
    </div>
    <div class="cols">
      <div class="card"><div class="card-h"><h2>Aparelhos por geração</h2></div>${linhas.map(x=>`<div style="display:grid;grid-template-columns:84px 1fr 36px;gap:10px;align-items:center;padding:5px 0"><span class="psub">iPhone ${x.l}</span><span class="bar" style="width:100%;height:12px"><i style="width:${x.un/maxL*100}%;background:var(--brand)"></i></span><b class="num" style="text-align:right">${x.un}</b></div>`).join('')}</div>
      <div class="card"><div class="card-h"><h2>Mais vendidos · 14 dias</h2></div>${topL.map(([n,q])=>`<div style="display:grid;grid-template-columns:1fr 90px 28px;gap:10px;align-items:center;padding:5px 0"><span class="t" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><span class="bar" style="width:100%;height:10px"><i style="width:${q/maxT*100}%;background:var(--ok)"></i></span><b class="num" style="text-align:right">${q}</b></div>`).join('')||'<div class="empty">Sem vendas no período.</div>'}</div>
    </div>
    <div class="cols">
      <div class="tbl-wrap" tabindex="0"><table><thead><tr><th>Categoria</th><th class="r">Unidades</th><th class="r">Custo</th><th class="r">Venda</th></tr></thead><tbody>${byCat.map(b=>`<tr><td class="pname">${{aparelho:'Aparelhos',peca:'Peças',acessorio:'Acessórios'}[b.c]}</td><td class="r num">${fmtN(b.un)}</td><td class="r num">${brl(b.custo)}</td><td class="r num">${brl(b.venda)}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><div class="card-h"><h2>Registros por pessoa · 14 dias</h2></div><div class="list">${porUser.map(x=>`<div class="li"><div class="avatar">${esc(x.u.nome[0])}</div><div class="grow"><div class="t">${esc(x.u.nome)}</div><div class="d">${PAPEIS[x.u.papel]}</div></div><b class="num">${x.n}</b></div>`).join('')}</div></div>
    </div>`;
}

/* ---------- desempenho por técnico ----------
   Conta o reparo para o técnico responsável no mês em que a OS ficou "Pronto".
   Receita = valor do serviço cobrado na OS (peças + mão de obra). */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const monthKey = ts => { const d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const monthLabel = k => { const [y,m] = k.split('-'); return MESES[+m-1]+' de '+y; };
const prontoTs = o => ((o.hist||[]).find(h=>h.status==='Pronto')||{}).ts;
function repairsIn(mk, userId){ return DB.os.filter(o=>o.tecnicoId && (!userId || o.tecnicoId===userId) && prontoTs(o) && monthKey(prontoTs(o))===mk); }
function statsOf(list){
  const receita = list.reduce((s,o)=>s+(o.valor||0),0);
  const pecas = list.reduce((s,o)=>s+osPecas(o).filter(x=>!x.pendente).reduce((a,x)=>a+(prod(x.prodId)?.custo||0)*x.qtd,0),0);
  return {n:list.length, receita, pecas, lucro:receita-pecas, ticket: list.length? receita/list.length : 0};
}
function pct(a,b){ if(!b) return a? '<span class="pill ok nodot">novo</span>' : ''; const p = Math.round((a/b-1)*100); return `<span class="pill ${p>=0?'ok':'bad'} nodot">${p>=0?'+':''}${p}% vs mês anterior</span>`; }
function renderPerf(){
  const v = $('#view'); const me = currentUser(); const dono = can('relatorios');
  const now = new Date(); const months = [0,1,2,3].map(i=>monthKey(new Date(now.getFullYear(), now.getMonth()-i, 15).getTime()));
  UI.perfMonth ||= months[0];
  if(!dono) UI.perfUser = me.id;
  const mk = UI.perfMonth; const prevK = monthKey(new Date(+mk.slice(0,4), +mk.slice(5)-2, 15).getTime());
  const monthSel = `<select class="in" id="pm" aria-label="Mês" style="width:auto">${months.map(k=>`<option value="${k}" ${k===mk?'selected':''}>${monthLabel(k)}</option>`).join('')}</select>`;
  const techs = DB.users.filter(u=>DB.os.some(o=>o.tecnicoId===u.id) || u.papel==='funcionario');
  let html = `<div class="head"><div><h1>Desempenho</h1><p>${dono?'Reparos concluídos e receita gerada por cada técnico.':'Seus reparos concluídos e a receita que você gerou.'} Um reparo conta no mês em que a OS ficou pronta.</p></div><div class="actions">${monthSel}</div></div>`;
  if(dono){
    const all = statsOf(repairsIn(mk));
    const rows = techs.map(u=>({u, st:statsOf(repairsIn(mk,u.id)), prev:statsOf(repairsIn(prevK,u.id)), andamento:DB.os.filter(o=>o.tecnicoId===u.id && !['Pronto','Entregue'].includes(o.status)).length})).sort((a,b)=>b.st.receita-a.st.receita);
    const maxR = Math.max(1,...rows.map(r=>r.st.receita));
    html += `<div class="kpis">
      <div class="kpi hero"><span class="l">Receita de reparos</span><span class="v" title="${brl(all.receita)}">${brlC(all.receita)}</span><span class="s">${monthLabel(mk)}</span></div>
      <div class="kpi"><span class="l">Reparos concluídos</span><span class="v">${all.n}</span><span class="s">${pct(all.n, statsOf(repairsIn(prevK)).n)}</span></div>
      <div class="kpi"><span class="l">Ticket médio</span><span class="v" title="${brl(all.ticket)}">${brlC(all.ticket)}</span><span class="s">por reparo</span></div>
      <div class="kpi"><span class="l">Lucro após peças</span><span class="v" style="color:var(--ok)" title="${brl(all.lucro)}">${brlC(all.lucro)}</span><span class="s">Peças ${brl(all.pecas)}</span></div></div>
    <div class="tbl-wrap" tabindex="0"><table><thead><tr><th>Técnico</th><th class="r">Reparos</th><th class="r">Receita gerada</th><th class="hide-sm">Participação</th><th class="r hide-sm">Ticket médio</th><th class="r hide-sm">Lucro após peças</th><th class="r hide-sm">Em andamento</th><th><span class="sr">Ações</span></th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr style="cursor:pointer" data-pu="${r.u.id}"><td><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${esc(r.u.nome[0])}</div><div><div class="pname">${esc(r.u.nome)}${i===0&&r.st.receita?' <span class="pill info nodot">1º do mês</span>':''}</div><div class="psub">${PAPEIS[r.u.papel]}</div></div></div></td>
        <td class="r num"><b>${r.st.n}</b></td><td class="r num"><b>${brl(r.st.receita)}</b></td>
        <td class="hide-sm"><span class="bar" style="width:120px;height:10px;display:inline-block;vertical-align:middle"><i style="width:${r.st.receita/maxR*100}%;background:var(--brand)"></i></span> <span class="psub num">${all.receita?Math.round(r.st.receita/all.receita*100):0}%</span></td>
        <td class="r num hide-sm">${brl(r.st.ticket)}</td><td class="r num hide-sm" style="color:var(--ok)">${brl(r.st.lucro)}</td><td class="r num hide-sm">${r.andamento}</td>
        <td><div class="rowact"><button class="btn sm">Ver perfil</button></div></td></tr>`).join('')}
    </tbody></table></div>`;
    UI.perfUser ||= rows[0]?.u.id;
  }
  const u = DB.users.find(x=>x.id===UI.perfUser) || me;
  const list = repairsIn(mk, u.id).sort((a,b)=>prontoTs(b)-prontoTs(a));
  const st = statsOf(list), prev = statsOf(repairsIn(prevK, u.id));
  const ativos = DB.os.filter(o=>o.tecnicoId===u.id && !['Pronto','Entregue'].includes(o.status));
  // reparos por dia no mês
  const [yy,mm] = mk.split('-').map(Number); const dias = new Date(yy,mm,0).getDate();
  const porDia = Array.from({length:dias},(_,i)=>list.filter(o=>new Date(prontoTs(o)).getDate()===i+1).length);
  const maxD = Math.max(1,...porDia); const W=980,H=110,pb=20; const bw=(W-10)/dias;
  const chart = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Reparos por dia">${porDia.map((n,i)=>`<rect x="${5+i*bw+bw*.15}" y="${H-pb-(n/maxD)*(H-pb-8)}" width="${bw*.7}" height="${(n/maxD)*(H-pb-8)}" rx="2" fill="var(--brand)"><title>Dia ${i+1}: ${n} reparo(s)</title></rect>`).join('')}<line x1="5" x2="${W-5}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${[1,8,15,22,dias].map(dn=>`<text x="${5+(dn-1)*bw+bw/2}" y="${H-4}" text-anchor="middle">${dn}</text>`).join('')}</svg>`;
  html += `<div class="card stack" id="perfil">
    <div class="card-h" style="margin:0"><div style="display:flex;gap:12px;align-items:center"><div class="avatar" style="width:46px;height:46px;font-size:19px">${esc(u.nome[0])}</div><div><h2 style="font-size:20px">${esc(u.nome)}</h2><span class="psub">${PAPEIS[u.papel]} · @${esc(u.usuario)} · ${monthLabel(mk)}</span></div></div>
      ${dono?`<select class="in" id="pu" aria-label="Técnico" style="width:auto">${techs.map(t=>`<option value="${t.id}" ${t.id===u.id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select>`:''}</div>
    <div class="kpis">
      <div class="kpi"><span class="l">Telefones reparados</span><span class="v">${st.n}</span><span class="s">${pct(st.n, prev.n)}</span></div>
      <div class="kpi"><span class="l">Receita gerada</span><span class="v" title="${brl(st.receita)}">${brlC(st.receita)}</span><span class="s">${pct(st.receita, prev.receita)}</span></div>
      <div class="kpi"><span class="l">Ticket médio</span><span class="v" title="${brl(st.ticket)}">${brlC(st.ticket)}</span><span class="s">por reparo</span></div>
      <div class="kpi"><span class="l">Em andamento agora</span><span class="v">${ativos.length}</span><span class="s">${ativos.map(o=>'OS '+o.num).join(', ')||'nenhuma'}</span></div>
    </div>
    <div class="chart"><p class="psub" style="margin:0 0 6px">Reparos concluídos por dia</p>${chart}</div>
    <div class="tbl-wrap" tabindex="0"><table><thead><tr><th>OS</th><th>Concluída</th><th>Aparelho</th><th class="hide-sm">Serviço</th><th class="r">Valor</th></tr></thead><tbody>
      ${list.map(o=>`<tr style="cursor:pointer" data-os="${o.id}"><td class="mono">${o.num}</td><td class="num psub">${fmtDate(prontoTs(o))}</td><td><div class="pname">${esc(o.aparelho)}</div><div class="psub">${esc(o.cliente)}</div></td><td class="hide-sm psub">${esc(osPecas(o).map(pecaLabel).join(', ')||o.defeito)}</td><td class="r num"><b>${brl(o.valor)}</b></td></tr>`).join('') || `<tr><td colspan="5"><div class="empty">Nenhum reparo concluído em ${monthLabel(mk)}.</div></td></tr>`}
    </tbody></table></div></div>`;
  v.innerHTML = html;
  $('#pm').onchange = e => { UI.perfMonth = e.target.value; renderPerf(); };
  if($('#pu')) $('#pu').onchange = e => { UI.perfUser = e.target.value; renderPerf(); };
  v.querySelectorAll('[data-pu]').forEach(r=>r.onclick=()=>{ UI.perfUser = r.dataset.pu; renderPerf(); $('#perfil').scrollIntoView({behavior:'smooth'}); });
  v.querySelectorAll('[data-os]').forEach(r=>r.onclick=()=>osDialog(DB.os.find(o=>o.id===r.dataset.os)));
}

/* ---------- usuários (dono) ---------- */
function renderUsers(){
  const v = $('#view'); const me = currentUser();
  v.innerHTML = `<div class="head"><div><h1>Usuários</h1><p>Cada pessoa da loja tem o próprio acesso, do tipo Dono ou Funcionário.</p></div><div class="actions"><button class="btn pri" id="nu">${ICON.plus}Novo usuário</button></div></div>
    <div class="cols">
      <div class="tbl-wrap" tabindex="0"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Tipo</th><th class="hide-sm">Situação</th><th><span class="sr">Ações</span></th></tr></thead><tbody>
        ${DB.users.map(u=>`<tr><td><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${esc(u.nome[0])}</div><span class="pname">${esc(u.nome)}</span></div></td><td class="mono">@${esc(u.usuario)}</td><td><span class="pill ${u.papel==='dono'?'info':'mute'} nodot">${PAPEIS[u.papel]}</span></td><td class="hide-sm">${u.ativo?'<span class="pill ok">Ativo</span>':'<span class="pill bad">Desativado</span>'}</td><td><div class="rowact"><button class="btn sm ghost icon" aria-label="Ver desempenho" title="Ver desempenho" data-perf="${u.id}">${ICON.perf}</button><button class="btn sm ghost icon" aria-label="Editar" data-u="${u.id}">${ICON.edit}</button></div></td></tr>`).join('')}
      </tbody></table></div>
      <div class="card stack"><h2>O que cada tipo pode fazer</h2>
        <dl class="kv"><dt>Funcionário</dt><dd>Consulta estoque, registra vendas, entradas, saídas e ordens de serviço.</dd>
        <dt>Dono</dt><dd>Tudo do funcionário, mais custos e margens, cadastro e exclusão de itens, ajuste de contagem, relatórios, usuários e configurações.</dd></dl>
      </div>
    </div>`;
  $('#nu').onclick = () => userDialog(null);
  v.querySelectorAll('[data-perf]').forEach(b=>b.onclick=()=>{ UI.perfUser=b.dataset.perf; go('desempenho'); });
  v.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>userDialog(DB.users.find(u=>u.id===b.dataset.u)));
  function userDialog(u){
    const novo = !u; u = u || {nome:'',usuario:'',senha:'',papel:'funcionario',ativo:true};
    const self = u.id===me.id;
    modal({title: novo?'Novo usuário':'Editar usuário', body:`
      <label class="f">Nome completo<input class="in" id="un" value="${esc(u.nome)}"></label>
      <div class="grid2"><label class="f">Usuário (login)<input class="in" id="uu" value="${esc(u.usuario)}" autocapitalize="none"></label><label class="f">Senha<input class="in" id="us" value="${esc(u.senha)}"></label></div>
      <div class="grid2"><label class="f">Tipo de acesso<select class="in" id="up" ${self?'disabled':''}><option value="funcionario" ${u.papel==='funcionario'?'selected':''}>Funcionário</option><option value="dono" ${u.papel==='dono'?'selected':''}>Dono</option></select></label>
        <label class="f">Situação<select class="in" id="ua" ${self?'disabled':''}><option value="1" ${u.ativo?'selected':''}>Ativo</option><option value="0" ${!u.ativo?'selected':''}>Desativado</option></select></label></div>
      ${self?'<p class="foot" style="margin:0">Você não pode mudar o próprio tipo nem se desativar.</p>':''}
      <div class="err" id="ue" role="alert"></div>`,
      foot:`<button class="btn" data-x>Cancelar</button><button class="btn pri" id="usave">Salvar</button>`,
      onMount:(el,close)=>{ $('#usave',el).onclick=()=>{
        const n = {nome:$('#un',el).value.trim(), usuario:$('#uu',el).value.trim().toLowerCase(), senha:$('#us',el).value, papel:$('#up',el).value, ativo:$('#ua',el).value==='1'};
        if(!n.nome||!n.usuario||!n.senha){ $('#ue',el).textContent='Preencha nome, usuário e senha.'; return; }
        if(DB.users.some(x=>x.usuario===n.usuario && x!==u)){ $('#ue',el).textContent='Esse usuário já existe.'; return; }
        if(novo){ n.id=uid(); DB.users.push(n); } else Object.assign(u,n);
        save(); close(); toast(novo?'Usuário criado':'Usuário atualizado'); render();
      }; }});
  }
}

/* ---------- configurações (dono) ---------- */
function renderCfg(){
  const v = $('#view');
  v.innerHTML = `<div class="head"><div><h1>Configurações</h1><p>Identidade da loja e dados do aplicativo.</p></div></div>
    <div class="cols">
      <div class="card stack"><h2>Logo da loja</h2>
        <div style="padding:16px;border:1px dashed var(--line);border-radius:12px;display:flex;justify-content:center">${logoHTML()}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn pri" id="lgb">Enviar logo (PNG, SVG ou JPG)</button><input type="file" id="lg" accept="image/*" hidden>${DB.cfg.logo?'<button class="btn" id="lgr">Voltar ao padrão</button>':''}</div>
        <label class="f">Nome e unidade exibidos<input class="in" id="lj" value="${esc(DB.cfg.loja)}"></label>
        <div><button class="btn" id="ljs">Salvar nome</button></div>
      </div>
      <div class="card stack"><h2>Backup e dados</h2>
        <p style="margin:0;color:var(--muted)">Os dados ficam salvos só neste navegador. Limpar o histórico do navegador ou trocar de aparelho apaga tudo. Baixe um backup com frequência.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="bk">Exportar backup</button><button type="button" class="btn" id="bkb">Importar backup</button><input type="file" id="bki" accept="application/json,.json" hidden></div>
        <p class="foot" style="margin:0">Restaurar o estoque de exemplo apaga as alterações feitas. Um backup é baixado antes.</p>
        <div><button class="btn danger" id="rst">Restaurar dados de exemplo</button></div>
      </div>
    </div>`;
  $('#lg').onchange = e => { const f = e.target.files[0]; if(!f) return; if(f.size>2e5){ toast('Imagem muito grande (máx. 200 KB)'); return; } const r = new FileReader(); r.onload = () => { DB.cfg.logo = r.result; save(); toast('Logo atualizada'); render(); }; r.readAsDataURL(f); };
  if($('#lgr')) $('#lgr').onclick = () => { DB.cfg.logo = null; save(); render(); };
  $('#ljs').onclick = () => { DB.cfg.loja = $('#lj').value.trim() || DB.cfg.loja; save(); toast('Nome salvo'); };
  $('#lgb').onclick = () => $('#lg').click();
  $('#bkb').onclick = () => $('#bki').click();
  $('#bk').onclick = () => toast(exportBackup() ? 'Backup baixado' : 'Não foi possível gerar o backup');
  $('#bki').onchange = e => { const fl = e.target.files[0]; if(!fl) return; const r = new FileReader(); r.onload = () => {
    let d = null; try{ d = JSON.parse(r.result); }catch(_){}
    if(!d || !(d.ver>=5) || !Array.isArray(d.users) || !Array.isArray(d.produtos) || !Array.isArray(d.movs) || !Array.isArray(d.os) || !d.users.some(u=>u.papel==='dono' && u.ativo)){ toast('Arquivo de backup inválido ou incompleto'); return; }
    d.cfg = d.cfg && typeof d.cfg==='object' ? d.cfg : {}; d.cfg.loja = d.cfg.loja || 'Chiq Cell · Ponto Chic, Bangu'; if(!d.osSeq) d.osSeq = Math.max(1000,...d.os.map(o=>o.num||0));
    confirmBox('Importar backup?', 'Os dados deste aparelho serão substituídos pelos do arquivo. Um backup dos dados atuais é baixado antes.', 'Importar', () => { exportBackup(); DB = d; SESSION = null; try{ localStorage.removeItem(KEY+'.sess'); }catch(_){} save(); toast('Backup importado. Entre de novo.'); render(); });
  }; r.readAsText(fl); };
  $('#rst').onclick = () => confirmBox('Restaurar dados?', 'Todo o estoque, usuários e ordens de serviço voltam ao exemplo inicial. Um backup é baixado antes.', 'Restaurar', () => { exportBackup(); const logo = DB.cfg.logo; DB = seed(); DB.cfg.logo = logo; save(); toast('Dados restaurados'); render(); });
}

load();
render();
if('serviceWorker' in navigator){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
